<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c1d6f"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a97442"/>
      <stop offset="100%" stop-color="#6a3a1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- platforms -->
  <rect x="120" y="280" width="180" height="20" rx="4" fill="#00aa66"/>
  <rect x="360" y="200" width="180" height="20" rx="4" fill="#00aa66"/>
  <rect x="560" y="280" width="180" height="20" rx="4" fill="#00aa66"/>
  <!-- ground -->
  <rect x="0" y="380" width="800" height="70" fill="url(#floor)"/>
  <rect x="0" y="378" width="800" height="4" fill="#4ca84c"/>
  <!-- players (stacked) -->
  <circle cx="200" cy="335" r="22" fill="#ff3333" stroke="#fff" stroke-width="3"/>
  <circle cx="200" cy="285" r="22" fill="#3366ff" stroke="#fff" stroke-width="3"/>
  <!-- single players -->
  <circle cx="450" cy="170" r="22" fill="#33cc44" stroke="#fff" stroke-width="3"/>
  <circle cx="640" cy="250" r="22" fill="#ffdd00" stroke="#fff" stroke-width="3"/>
  <!-- title -->
  <text x="400" y="80" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-2">PIKO<tspan fill="#67e8f9">PARK</tspan></text>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#e9d5ff" text-anchor="middle" letter-spacing="3">CO-OP · 1–8 PLAYERS · BROWSER</text>
</svg>
